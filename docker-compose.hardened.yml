# ==============================================================================
# FACTURAMI - Docker Compose Hardened (Alternativo, Sin Aplicar)
# ==============================================================================
# Mejoras respecto al compose actual:
# 1. Base de datos aislada en carpeta ./data montada a /app/data (permite a SQLite
#    crear facturami.db-wal y facturami.db-shm con permisos de directorio).
# 2. Montaje de código y plantillas como Solo Lectura (:ro) para prevenir cualquier
#    modificación o inyección en tiempo de ejecución.
# 3. Mantiene persistencia de storage/, tmp/ y backups/ con usuario no root (10001).
# ==============================================================================

services:
  # ── Backend & Web App FACTURAMI (Flask + Gunicorn) ───────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturami_app
    restart: unless-stopped
    environment:
      - FLASK_PORT=5001
      - FLASK_HOST=0.0.0.0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?define JWT_SECRET_KEY en .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/importar-facturas
      - N8N_BASE_URL=http://n8n:5678
      - N8N_INTERNAL_SECRET=${N8N_INTERNAL_SECRET:?define N8N_INTERNAL_SECRET en .env}
      - CORS_ORIGINS=*
      - FACTURAMI_STORAGE_PATH=/app/storage
      - FACTURAMI_TMP_PATH=/app/tmp
      - FACTURAMI_DB_PATH=/app/data/facturami.db
    volumes:
      # Base de datos aislada en directorio dedicado
      - ./data:/app/data
      # Archivo de usuarios (autenticación)
      - ./users.json:/app/users.json
      # Almacenamiento y temporales de subida
      - ./storage:/app/storage
      - ./tmp:/app/tmp
      - ./backups:/app/backups
      # Código fuente y vistas montadas estrictamente como SOLO LECTURA (:ro)
      - ./landing.html:/app/landing.html:ro
      - ./FACTURAMI.html:/app/FACTURAMI.html:ro
      - ./app.py:/app/app.py:ro
      - ./db.py:/app/db.py:ro
      - ./schemas.py:/app/schemas.py:ro
      - ./errors.py:/app/errors.py:ro
      - ./routes:/app/routes:ro
      - ./services:/app/services:ro
    depends_on:
      - n8n
    networks:
      - facturami_net

  # ── Motor de Automatización & OCR n8n ─────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: facturami_n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_DOMAIN:-n8n.facturami.app}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_DOMAIN:-n8n.facturami.app}/
      - GENERIC_TIMEZONE=America/Costa_Rica
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?define N8N_ENCRYPTION_KEY en .env}
      - N8N_USER_MANAGEMENT_DISABLED=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - facturami_net

  # ── Reverse Proxy Caddy (TLS Automático) ───────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: facturami_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - n8n
    networks:
      - facturami_net

networks:
  facturami_net:
    driver: bridge

volumes:
  n8n_data:
  caddy_data:
  caddy_config:

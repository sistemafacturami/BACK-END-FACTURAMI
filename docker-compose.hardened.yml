services:
  # ── Backend & Web App FACTURAMI (Flask + Gunicorn) ───────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturami_app
    restart: unless-stopped
    environment:
      - FLASK_PORT=5001
      - FLASK_HOST=0.0.0.0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?define JWT_SECRET_KEY en .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/importar-facturas
      - N8N_BASE_URL=http://n8n:5678
      - N8N_INTERNAL_SECRET=${N8N_INTERNAL_SECRET:?define N8N_INTERNAL_SECRET en .env}
      - CORS_ORIGINS=https://${DOMAIN_NAME:-facturami.app}
      - FACTURAMI_STORAGE_PATH=/app/storage
      - FACTURAMI_TMP_PATH=/app/tmp
      - FACTURAMI_DB_PATH=/app/data/facturami.db
    volumes:
      # Persistencia en el disco del host
      - ./data:/app/data
      - ./users.json:/app/users.json
      - ./storage:/app/storage
      - ./tmp:/app/tmp
      - ./backups:/app/backups
      - ./landing.html:/app/landing.html:ro
      - ./FACTURAMI.html:/app/FACTURAMI.html:ro
      - ./app.py:/app/app.py:ro
      - ./db.py:/app/db.py:ro
      - ./schemas.py:/app/schemas.py:ro
      - ./errors.py:/app/errors.py:ro
      - ./routes:/app/routes:ro
      - ./services:/app/services:ro
    depends_on:
      - n8n
    networks:
      - facturami_net

  # ── Motor de Automatización & OCR n8n ─────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: facturami_n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_DOMAIN:-n8n.facturami.app}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_DOMAIN:-n8n.facturami.app}/
      - N8N_WEBHOOK_URL=https://${N8N_DOMAIN:-n8n.facturami.app}/
      - N8N_EDITOR_BASE_URL=https://${N8N_DOMAIN:-n8n.facturami.app}/
      - GENERIC_TIMEZONE=America/Costa_Rica
      - TZ=America/Costa_Rica
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./storage:/data/storage:ro
    networks:
      - facturami_net

  # ── Reverse Proxy & Certificados SSL Automáticos (Caddy) ──────
  caddy:
    image: caddy:2-alpine
    container_name: facturami_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-facturami.app}
      - N8N_DOMAIN=${N8N_DOMAIN:-n8n.facturami.app}
      - ACME_EMAIL=${ACME_EMAIL:-soporte@facturami.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - n8n
    networks:
      - facturami_net

networks:
  facturami_net:
    driver: bridge

volumes:
  n8n_data:
  caddy_data:
  caddy_config:

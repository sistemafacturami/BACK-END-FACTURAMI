name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run test suite
        run: python -m pytest tests/test_fase1_authz.py -v
        env:
          JWT_SECRET_KEY: ci-only-jwt-key-0123456789-0123456789-abcdef
          N8N_INTERNAL_SECRET: ci-only-n8n-key-0123456789-0123456789-abcd
